# HAo Studio 独立版 2.0 — Codemagic 工作流
#
# 仓库：GitHub lauranthao/haostudio-standalone-2.0，分支 main
# （2.0 发布线；旧仓库 haostudio-standalone 的 main 是 Flutter 1.1.6 线，
# 各用各的 codemagic.yaml，互不干扰）。
# 2.0 是 Swift 原生重写：没有 web 前端、没有外部元数据服务、没有 Podfile（地基阶段）。
# 因此旧工作流的两步已删除：
#   - web 前端同步进包（2.0 没有 web/，没有旧的网页壳）
#   - 外部元数据 key 注入（该服务已从独立版移除，豆瓣是唯一元数据源）
# 保留：libmpv 下载、pod install（地基阶段无 Podfile 时跳过，播放器 slice
#   加回 Podfile 后自动恢复）、构建、打包。
# 触发：push 到 main 即构建（S0 门禁：preflight 先跑，
# 不通过则构建失败）。Swift 应用 id 6afa12e482fb30c0f828e6e3——
# 已切到新仓库 haostudio-standalone-2.0，分支 main。
#
# libmpv 不在仓库里（18 个 xcframework）：构建时下载 Predidit 0.6.8
# iOS release，解压到 ios/Vendor/libmpv（工程引用的路径）。
workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 26.2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Preflight checks (S0 gate)
        script: |
          # 工程引用、资产、Info.plist、启动动画数值、主题色值、版本对齐、
          # codemagic 配置。任一检查失败即退出 1，构建到此为止。
          # 不代替编译；编译验证就是下面的 xcodebuild。
          python3 ios/preflight_check.py
      - name: Migration unit tests (S1)
        script: |
          # SwiftPM package in ios/: compiles the same Storage sources
          # the app target compiles and runs the migration suite
          # (snapshot, corrupt snapshot, bad types, rollback,
          # idempotency, backup import, keychain). No Xcode project
          # changes needed. Fails the build when a test fails.
          cd ios
          swift test
      - name: Download libmpv frameworks (MPV player backend)
        script: |
          # libmpv is NOT in the repo (18 xcframeworks, ~57MB): download the
          # Predidit 0.6.8 iOS release tarball, verify sha256, extract into
          # ios/Vendor/libmpv (the path the Xcode project references).
          LIBMPV_URL="https://github.com/Predidit/libmpv-darwin-build/releases/download/0.6.8/libmpv-xcframeworks_0.6.8_ios-universal-video-default.tar.gz"
          LIBMPV_SHA256="d428641cc6c100de8234eae04e229966e46949eb73fcabd526a008a02e9bf968"
          mkdir -p ios/Vendor/libmpv
          cd ios/Vendor/libmpv
          curl -L --fail -o libmpv-ios.tar.gz "$LIBMPV_URL"
          echo "$LIBMPV_SHA256  libmpv-ios.tar.gz" | shasum -a 256 -c -
          tar -xzf libmpv-ios.tar.gz --strip-components=1
          test -d Mpv.xcframework || { echo "libmpv extract failed: Mpv.xcframework missing"; exit 1; }
          rm libmpv-ios.tar.gz
          ls
      - name: Install CocoaPods dependencies
        script: |
          # Foundation slice: no Podfile yet (no IJK / player backends in
          # the 2.0 tree). Skip instead of failing; the player slice adds
          # the Podfile back and this step runs again unchanged.
          cd ios
          if [ ! -f Podfile ]; then
            echo "no Podfile in foundation slice; skipping pod install"
            exit 0
          fi
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not found, installing..."
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install
      - name: Build unsigned app
        script: |
          cd ios
          # CocoaPods (when a Podfile exists) generates HAoStudio.xcworkspace;
          # without pods the .xcodeproj builds directly.
          if [ -d HAoStudio.xcworkspace ]; then
            xcodebuild -workspace HAoStudio.xcworkspace \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project HAoStudio.xcodeproj \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi
      - name: Xcode test target compiles (device build-for-testing)
        script: |
          cd ios
          # (2026-11-25, b49fix2 T5): the Xcode HAoStudioTests target
          # never executed anywhere — no workflow ran xcodebuild test
          # and there was no shared scheme (now committed at
          # HAoStudio.xcodeproj/xcshareddata/xcschemes/). This step
          # proves the test target COMPILES (build-for-testing,
          # device SDK, unsigned). It does NOT run the tests: the
          # simulator link is broken by IJK (arm64 device-only
          # static lib) and there is no device on CI, so a real
          # `xcodebuild test` run needs an IJK simulator slice
          # first. Do not add a simulator test step that cannot link
          # and call it a fix.
          xcodebuild -project HAoStudio.xcodeproj \
            -scheme HAoStudioTests \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build \
            build-for-testing \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        script: |
          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload HAoStudio.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          # LCSign (2026-11-24, b37) cannot import a `zip -r` IPA: it
          # puts Payload/*.app/Info.plist last and LCSign's
          # shallow/local-header scan never reaches it. package_ipa.py
          # writes Info.plist third, plain deflate, no extra fields,
          # no data descriptors — same packager Bitrise uses.
          python3 package_ipa.py Payload HAoStudio.ipa
          ls -lh HAoStudio.ipa
    artifacts:
      - ios/HAoStudio.ipa
  ios-simulator:
    name: iOS Simulator App (self-test)
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: 26.2
    # No triggering block: manual start only. Used to self-test the
    # fixed build in a cloud simulator (Appetize) before shipping
    # the device IPA — chen must not be the tester (2026-11-24).
    scripts:
      - name: Preflight checks (S0 gate)
        script: |
          python3 ios/preflight_check.py
      - name: Migration unit tests (S1)
        script: |
          cd ios
          swift test
      - name: Download libmpv frameworks (MPV player backend)
        script: |
          LIBMPV_URL="https://github.com/Predidit/libmpv-darwin-build/releases/download/0.6.8/libmpv-xcframeworks_0.6.8_ios-universal-video-default.tar.gz"
          LIBMPV_SHA256="d428641cc6c100de8234eae04e229966e46949eb73fcabd526a008a02e9bf968"
          mkdir -p ios/Vendor/libmpv
          cd ios/Vendor/libmpv
          curl -L --fail -o libmpv-ios.tar.gz "$LIBMPV_URL"
          echo "$LIBMPV_SHA256  libmpv-ios.tar.gz" | shasum -a 256 -c -
          tar -xzf libmpv-ios.tar.gz --strip-components=1
          test -d Mpv.xcframework || { echo "libmpv extract failed: Mpv.xcframework missing"; exit 1; }
          rm libmpv-ios.tar.gz
          ls
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          if [ ! -f Podfile ]; then
            echo "no Podfile in foundation slice; skipping pod install"
            exit 0
          fi
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not found, installing..."
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install
      - name: Build simulator app
        script: |
          cd ios
          # Same sources as the device build, simulator SDK. KNOWN
          # BROKEN (2026-11-25, b49fix2 T5): IJKMediaFramework is an
          # arm64 device-only static library — the simulator link
          # fails ("building for 'iOS-simulator', but linking in
          # object file built for 'iOS'"). libmpv ships simulator
          # slices; IJK is the blocker. This manual-only workflow is
          # kept as the record of that failure: it goes green again
          # when IJK gains a simulator slice or is conditional-
          # compiled out for simulator builds. The device
          # build-for-testing step in ios-unsigned is the honest
          # gate until then — do not add a simulator test step here
          # and call it a fix.
          if [ -d HAoStudio.xcworkspace ]; then
            xcodebuild -workspace HAoStudio.xcworkspace \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project HAoStudio.xcodeproj \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi
      - name: Package simulator app
        script: |
          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -f HAoStudio-simulator.app.zip
          zip -r HAoStudio-simulator.app.zip "$APP_PATH"
          ls -lh HAoStudio-simulator.app.zip
    artifacts:
      - ios/HAoStudio-simulator.app.zip
