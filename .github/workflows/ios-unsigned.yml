# HAo Studio 2.0 Swift 应用的 GitHub Actions 构建，
# 1:1 对照 codemagic.yaml 的 ios-unsigned 工作流。
# 手动触发（workflow_dispatch），默认 main。

name: iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: iOS Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Preflight checks (S0 gate)
        run: python3 ios/preflight_check.py

      - name: Migration unit tests (S1)
        run: |
          cd ios
          swift test

      - name: Download libmpv frameworks (MPV player backend)
        run: |
          LIBMPV_URL="https://github.com/Predidit/libmpv-darwin-build/releases/download/0.6.8/libmpv-xcframeworks_0.6.8_ios-universal-video-default.tar.gz"
          LIBMPV_SHA256="d428641cc6c100de8234eae04e229966e46949eb73fcabd526a008a02e9bf968"
          mkdir -p ios/Vendor/libmpv
          cd ios/Vendor/libmpv
          curl -L --fail -o libmpv-ios.tar.gz "$LIBMPV_URL"
          echo "$LIBMPV_SHA256  libmpv-ios.tar.gz" | shasum -a 256 -c -
          tar -xzf libmpv-ios.tar.gz --strip-components=1
          test -d Mpv.xcframework || { echo "libmpv extract failed: Mpv.xcframework missing"; exit 1; }
          rm libmpv-ios.tar.gz
          ls

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          if [ ! -f Podfile ]; then
            echo "no Podfile; skipping pod install"
            exit 0
          fi
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not found, installing..."
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install

      - name: Build unsigned app
        run: |
          cd ios
          if [ -d HAoStudio.xcworkspace ]; then
            xcodebuild -workspace HAoStudio.xcworkspace \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project HAoStudio.xcodeproj \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Xcode test target compiles (device build-for-testing)
        run: |
          cd ios
          # (2026-11-25, b49fix2 T5): the Xcode HAoStudioTests target
          # never executed anywhere — no workflow ran xcodebuild test
          # and there was no shared scheme (now committed at
          # HAoStudio.xcodeproj/xcshareddata/xcschemes/). This step
          # proves the test target COMPILES (build-for-testing,
          # device SDK, unsigned). It does NOT run the tests: the
          # simulator link is broken by IJK (arm64 device-only
          # static lib) and there is no device on CI, so a real
          # `xcodebuild test` run needs an IJK simulator slice
          # first. Do not add a simulator test step that cannot link
          # and call it a fix.
          # (2026-11-26, b49fix38): build via the WORKSPACE, not
          # -project — Bitrise #44 proved -project cannot resolve
          # the HAoStudio module's IJKMediaFramework dependency:
          # the Pods project is only in the build graph via the
          # workspace, so with -project the framework is never
          # built and SwiftDriver reports "Unable to find module
          # dependency: 'IJKMediaFramework'". Same workspace-first
          # form as the app build step above; the -project
          # fallback is for a no-Podfile tree (no IJK at all).
          if [ -d HAoStudio.xcworkspace ]; then
            xcodebuild -workspace HAoStudio.xcworkspace \
              -scheme HAoStudioTests \
              -configuration Debug \
              -sdk iphoneos \
              -derivedDataPath build \
              build-for-testing \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project HAoStudio.xcodeproj \
              -scheme HAoStudioTests \
              -configuration Debug \
              -sdk iphoneos \
              -derivedDataPath build \
              build-for-testing \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Package IPA
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload HAoStudio.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          # LCSign (2026-11-24, b37) cannot import a `zip -r` IPA: it
          # puts Payload/*.app/Info.plist last and LCSign's
          # shallow/local-header scan never reaches it. package_ipa.py
          # writes Info.plist third, plain deflate, no extra fields,
          # no data descriptors — same packager Bitrise uses.
          python3 package_ipa.py Payload HAoStudio.ipa
          ls -lh HAoStudio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAoStudio-ipa
          path: ios/HAoStudio.ipa
          retention-days: 30
