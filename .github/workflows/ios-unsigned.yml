# HAo Studio 2.0 Swift 应用的 GitHub Actions 构建，
# 1:1 对照 codemagic.yaml 的 ios-unsigned 工作流。
# 手动触发（workflow_dispatch），默认 main。

name: iOS Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit to build (default: main)'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: iOS Unsigned IPA
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Select Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Preflight checks (S0 gate)
        run: python3 ios/preflight_check.py

      - name: Migration unit tests (S1)
        run: |
          cd ios
          swift test

      - name: Download libmpv frameworks (MPV player backend)
        run: |
          LIBMPV_URL="https://github.com/Predidit/libmpv-darwin-build/releases/download/0.6.8/libmpv-xcframeworks_0.6.8_ios-universal-video-default.tar.gz"
          LIBMPV_SHA256="d428641cc6c100de8234eae04e229966e46949eb73fcabd526a008a02e9bf968"
          mkdir -p ios/Vendor/libmpv
          cd ios/Vendor/libmpv
          curl -L --fail -o libmpv-ios.tar.gz "$LIBMPV_URL"
          echo "$LIBMPV_SHA256  libmpv-ios.tar.gz" | shasum -a 256 -c -
          tar -xzf libmpv-ios.tar.gz --strip-components=1
          test -d Mpv.xcframework || { echo "libmpv extract failed: Mpv.xcframework missing"; exit 1; }
          rm libmpv-ios.tar.gz
          ls

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          if [ ! -f Podfile ]; then
            echo "no Podfile; skipping pod install"
            exit 0
          fi
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not found, installing..."
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install

      - name: Build unsigned app
        run: |
          cd ios
          if [ -d HAoStudio.xcworkspace ]; then
            xcodebuild -workspace HAoStudio.xcworkspace \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          else
            xcodebuild -project HAoStudio.xcodeproj \
              -scheme HAoStudio \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Package IPA
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "App: $APP_PATH"
          rm -rf Payload HAoStudio.ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r HAoStudio.ipa Payload
          ls -lh HAoStudio.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HAoStudio-ipa
          path: ios/HAoStudio.ipa
          retention-days: 30
